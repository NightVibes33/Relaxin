name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_16.4.app/Contents/Developer ]]; then
            export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
          elif [[ -d /Applications/Xcode.app/Contents/Developer ]]; then
            export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          else
            DEVELOPER_DIR="$(find /Applications -maxdepth 2 -type d -path '*/Xcode*.app/Contents/Developer' | sort | tail -n 1)"
            test -n "$DEVELOPER_DIR"
            export DEVELOPER_DIR
          fi
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install required host tools
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg ldid
          command -v rg >/dev/null 2>&1 || brew install ripgrep

          mkdir -p "$HOME/.local/bin"
          curl -fL --retry 3 \
            "https://github.com/CRKatri/trustcache/releases/download/v2.0/trustcache_macos_arm64" \
            -o "$HOME/.local/bin/trustcache"
          chmod +x "$HOME/.local/bin/trustcache"
          xattr -rc "$HOME/.local/bin/trustcache" || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          command -v rg
          command -v dpkg-deb
          command -v ldid
          command -v trustcache
          trustcache --help >/dev/null 2>&1 || trustcache -h >/dev/null 2>&1 || true

      - name: Build unsigned iOS 16 device IPA
        shell: bash
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '16.0'
          CODE_SIGNING_ALLOWED: 'NO'
          CODE_SIGNING_REQUIRED: 'NO'
          CODE_SIGN_IDENTITY: ''
        run: |
          set -euo pipefail
          chmod +x DevKit/Helpers/*.sh DevKit/Packaging/RelaxinLite/*.sh || true
          make clean
          make ipa

      - name: Verify unsigned device IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA="$(find build/Artifacts -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          unzip -tq "$IPA"
          unzip -p "$IPA" Payload/Relaxin.app/Info.plist > /tmp/Relaxin-Info.plist
          plutil -p /tmp/Relaxin-Info.plist
          TARGET="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' /tmp/Relaxin-Info.plist 2>/dev/null || true)"
          echo "MinimumOSVersion=$TARGET"
          test "$TARGET" = "16.0"
          if unzip -Z1 "$IPA" | grep -Eq '(^|/)(_CodeSignature/|embedded\\.mobileprovision$)'; then
            echo 'error: unsigned IPA contains signing material' >&2
            exit 1
          fi
          echo "Verified device IPA: $IPA"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Relaxin-unsigned-IPA-iOS16
          path: build/Artifacts/*.ipa
          if-no-files-found: error
          retention-days: 14
